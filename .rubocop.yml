AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/OneClassPerFile:
  Exclude:
    - "lib/recording_studio_views/capabilities/viewable.rb"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'

Metrics/AbcSize:
  Max: 28
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'

Metrics/CyclomaticComplexity:
  Max: 14

Metrics/PerceivedComplexity:
  Max: 14

Metrics/ClassLength:
  Max: 130
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Max: 40

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'test/services/**/*'
